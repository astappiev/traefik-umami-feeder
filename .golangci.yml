version: "2"

linters:
  default: all
  disable:
    - bodyclose
    - cyclop
    - dupl
    - embeddedstructfieldcheck
    - err113
    - exhaustive
    - exhaustruct
    - exhaustruct_v5
    - forbidigo
    - gochecknoglobals
    - gomodguard
    - intrange # range-over-int is not supported by Yaegi
    - lll
    - mnd
    - nlreturn
    - noctx
    - noinlineerr
    - paralleltest
    - rowserrcheck
    - sqlclosecheck
    - testpackage
    - tparallel
    - varnamelen
    - wrapcheck
    - wsl
    - wsl_v5
    - revive
  settings:
    funlen:
      lines: -1
      statements: 50
    goconst:
      min-len: 5
      min-occurrences: 4
    gocyclo:
      min-complexity: 15
    godox:
      keywords:
        - FIXME
    tagliatelle:
      case:
        ignored-fields:
          - IgnoreURLs
    govet:
      disable:
        - fieldalignment
      enable-all: true
    misspell:
      locale: US
    modernize:
      disable:
        - rangeint # range-over-int is not supported by Yaegi
  exclusions:
    generated: lax
    rules:
      - linters:
          - funlen
          - goconst
          - godot
        path: (.+)_test.go
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  max-same-issues: 0

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
